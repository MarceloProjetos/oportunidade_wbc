# Organograma do escritório (docs/PLANO_ORGANOGRAMA.md, F0/F1).
#
# THE RULE: a role here NEVER grants anything. Scopes live in state/credenciais.json and are
# changed only with `python -m seguranca`; who may approve comes from X-SIS-Papel. This file
# only says who handles what, how an agent introduces itself and where things escalate.
# `python -m operacao.organograma conferir` compares it with the credentials (read-only).
#
# PUBLIC REPO: role, papel and first name only -- never a phone, e-mail, WhatsApp JID or
# surname. `contato` is a nickname (letters only) resolved in the .90's .env. The check refuses
# '@' and phone numbers anywhere; a surname on an agent or inside a sentence only review catches.
#
# Edit, then: python -m operacao.organograma            (shows it; refuses an invalid file)
#             python -m pytest tests/test_organograma.py  (the commit gate checks it too)
# An invalid edit never takes the agents down: the .11 keeps the last valid version.
#
# membro.tipo: "agente" | "pessoa" (first name only) | "equipe" (a group of people)
# Agent-only keys: credencial, pede (CATALOGO actions), escopos_esperados, apresentacao.
# People-only keys: aprova (papeis), contato.

versao = 1

# --- Agents ---------------------------------------------------------------------------

[[membro]]
id = "mira"
tipo = "agente"
nome = "Mira"
cargo = "Atendimento, Comercial e PCP"
credencial = "mira-agente"
