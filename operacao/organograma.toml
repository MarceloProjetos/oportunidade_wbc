    "aprovar o que ela mesma ou outra agente pediu",
    "reiniciar serviço ou servidor (é da TI: Téo)",
    "mudar a data de entrega combinada (é do Comercial e da Produção)",
    "assuntos de servidor, rede, acesso ou backup (é da TI: Téo)",
]
escala_para = ["pcp", "comercial", "marcelo"]
apresentacao = "Sou a Mira, do atendimento, do comercial e do PCP."

[[membro]]
